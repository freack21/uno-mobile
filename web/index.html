<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Last Card — a fast shedding card game. Play offline against bots.">
  <!-- Lay out under notches / home indicator; the app keeps clear with SafeArea. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14161B">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Last Card">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Last Card</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14161B;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 250ms ease;
    }
    #splash img { width: 112px; height: 112px; border-radius: 26px; }
    #splash .bar {
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: #272B34;
      overflow: hidden;
    }
    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #E5392C;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Last Card">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', () => {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.remove(), 300);
    });

    // Update bridge used by the app (lib/ui/app_update_web.dart): the app
    // shows an "Update available" toast and calls apply() when tapped.
    window.lastCardUpdate = (() => {
      let waiting = null;
      const listeners = [];
      return {
        onReady(cb) {
          listeners.push(cb);
          if (waiting) cb();
        },
        apply() {
          if (!waiting) return location.reload();
          window.__lcUpdating = true;
          waiting.postMessage({ type: 'skip-waiting' });
        },
        _ready(worker) {
          waiting = worker;
          listeners.forEach((cb) => cb());
        },
      };
    })();

    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloading && window.__lcUpdating) {
          reloading = true;
          location.reload();
        }
      });
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // A worker left waiting by an earlier visit takes over now, before
        // the game starts, so the update lands without a prompt.
        if (reg.waiting && navigator.serviceWorker.controller) {
          window.__lcUpdating = true;
          reg.waiting.postMessage({ type: 'skip-waiting' });
          return;
        }
        // A newer version found while the app is open waits for the player.
        const track = (worker) => {
          if (!worker) return;
          const check = () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              window.lastCardUpdate._ready(worker);
            }
          };
          check();
          worker.addEventListener('statechange', check);
        };
        track(reg.installing);
        reg.addEventListener('updatefound', () => track(reg.installing));

        // Installed apps are often resumed instead of reopened, which does
        // not check for updates: check when shown again and every 30 min.
        const update = () => reg.update().catch(() => {});
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') update();
        });
        setInterval(update, 30 * 60 * 1000);
      }).catch((e) => console.warn('Service worker registration failed', e));

      // First visit: hand the files already loaded to the worker so the
      // game also starts offline next time.
      window.addEventListener('load', () => {
        navigator.serviceWorker.ready.then((reg) => {
          setTimeout(() => {
            const urls = performance.getEntriesByType('resource').map((e) => e.name);
            urls.push(location.href);
            reg.active && reg.active.postMessage({ type: 'cache-urls', urls });
          }, 4000);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
