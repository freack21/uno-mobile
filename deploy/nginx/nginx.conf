# Runs as the unprivileged nginx user: pid and temp files live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  # Traefik terminates TLS; never leak the container port in redirects.
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json
             application/wasm image/svg+xml font/ttf font/otf application/octet-stream;

  # Cache policy by path. Hashed files are immutable; entry points, the
  # service worker and the unhashed renderer files always revalidate.
  map $uri $cache_control {
    ~^/main\.dart\.[0-9a-f]+\.js$ "public, max-age=31536000, immutable";
    ~^/assets/                    "public, max-age=31536000, immutable";
    default                       "no-cache";
  }

  server {
    # IPv4 only: some hosts have no IPv6 inside containers.
    listen 8080;
    root /usr/share/nginx/html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
