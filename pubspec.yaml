name: uno_mobile
description: "Last Card — a fast shedding card game against bots."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  last_card_core:
    path: packages/last_card_core
  web_socket_channel: ^3.0.3
  web: ^1.1.2
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Sound effects for the app (the web build synthesizes them instead).
    - assets/sfx/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
