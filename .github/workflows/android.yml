name: Android

# Signed release builds of the app. Runs for version tags (v1.2.3) and on
# demand from the Actions tab. Needs two repository secrets (see
# docs/android.md): ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PASSWORD (docs/android.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$PASSWORD" "$PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Signed with the debug key"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: last-card-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the key
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
